<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #111827;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 10px;
    }
    .alliance-name {
      text-align: center;
      color: #eab308;
      font-size: 0.85rem;
      font-weight: bold;
      letter-spacing: 2px;
      margin-bottom: 4px;
    }
    h1 {
      color: white;
      text-align: center;
      font-size: 1.5rem;
      margin-bottom: 12px;
    }
    .rally-select {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .rally-btn {
      padding: 12px 25px;
      font-size: 1.1rem;
      font-weight: bold;
      color: #9ca3af;
      background: #374151;
      border: 2px solid #4b5563;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .rally-btn:hover {
      background: #4b5563;
    }
    .rally-btn.active {
      color: #1f2937;
      background: #eab308;
      border-color: #eab308;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      max-width: 600px;
      margin: 0 auto 20px;
    }
    .player-card {
      background: #1f2937;
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      border: 3px solid #374151;
      transition: all 0.3s;
    }
    .player-card.waiting {
      border-color: #f59e0b;
      background: #292524;
    }
    .player-card.go {
      border-color: #22c55e;
      background: #14532d;
      animation: pulse 0.5s ease-in-out infinite alternate;
    }
    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.02); }
    }
    .player-name-input {
      width: 100%;
      padding: 6px 8px;
      font-size: 0.95rem;
      font-weight: bold;
      text-align: center;
      color: #eab308;
      background: #374151;
      border: 1px solid #4b5563;
      border-radius: 6px;
      margin-bottom: 8px;
      outline: none;
    }
    .player-name-input:focus {
      border-color: #eab308;
    }
    .player-name-input.running {
      background: transparent;
      border-color: transparent;
      pointer-events: none;
    }
    .player-name-display {
      color: #eab308;
      font-size: 0.95rem;
      font-weight: bold;
      margin-bottom: 8px;
    }
    .time-label {
      color: #6b7280;
      font-size: 0.75rem;
      margin-bottom: 4px;
    }
    .time-input {
      width: 80px;
      padding: 10px;
      font-size: 1.5rem;
      text-align: center;
      border: 2px solid #4b5563;
      border-radius: 8px;
      background: #374151;
      color: white;
      outline: none;
    }
    .time-input:focus {
      border-color: #eab308;
    }
    .countdown {
      font-size: 3rem;
      font-weight: bold;
      color: #f59e0b;
      display: none;
      font-variant-numeric: tabular-nums;
    }
    .countdown.go {
      color: #22c55e;
      font-size: 2.5rem;
    }
    .status {
      color: #9ca3af;
      font-size: 0.8rem;
      margin-top: 5px;
      min-height: 1.2em;
    }
    .controls {
      text-align: center;
      margin-bottom: 10px;
    }
    .start-btn {
      padding: 15px 50px;
      font-size: 1.3rem;
      font-weight: bold;
      color: white;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .start-btn:hover {
      transform: scale(1.05);
    }
    .start-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .reset-btn {
      display: none;
      margin-top: 10px;
      padding: 10px 30px;
      font-size: 1rem;
      color: #9ca3af;
      background: #374151;
      border: 2px solid #4b5563;
      border-radius: 8px;
      cursor: pointer;
    }
    .reset-btn:hover {
      background: #4b5563;
    }
    .info {
      text-align: center;
      color: #6b7280;
      font-size: 0.85rem;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="alliance-name">— SUA —</div>
  <h1 id="mainTitle">🎯 5分集結タイマー</h1>

  <div class="rally-select">
    <button class="rally-btn" id="rally1" onclick="selectRally(1)">1分集結</button>
    <button class="rally-btn active" id="rally5" onclick="selectRally(5)">5分集結</button>
  </div>

  <div class="grid" id="playerGrid"></div>

  <div class="controls">
    <button class="start-btn" id="startBtn">🚀 カウントダウン開始</button>
    <br>
    <button class="reset-btn" id="resetBtn">🔄 リセット</button>
  </div>

  <div class="info">行軍時間(秒)を入力 → カウントダウン開始で同時着弾！</div>

  <script>
    const DEFAULT_PLAYERS = ['PLAYER1', 'PLAYER2', 'PLAYER3', 'PLAYER4];
    const STORAGE_KEY = 'sua_rally_players';

    let isRunning = false;
    let timers = [];
    let selectedRally = 5;

    // プレイヤー名をlocalStorageから読み込み
    const loadPlayerNames = () => {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          if (Array.isArray(parsed) && parsed.length === 4) return parsed;
        }
      } catch(e) {}
      return [...DEFAULT_PLAYERS];
    };

    // プレイヤー名をlocalStorageに保存
    const savePlayerNames = () => {
      const names = [0,1,2,3].map(i => {
        const input = document.getElementById(`name-${i}`);
        return input ? input.value.trim() || `Player ${i+1}` : DEFAULT_PLAYERS[i];
      });
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(names)); } catch(e) {}
    };

    // 集結選択
    const selectRally = (minutes) => {
      if (isRunning) return;
      selectedRally = minutes;
      document.getElementById('rally1').classList.toggle('active', minutes === 1);
      document.getElementById('rally5').classList.toggle('active', minutes === 5);
      document.getElementById('mainTitle').textContent = `🎯 ${minutes}分集結タイマー`;
    };

    // AudioContext for sounds
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    const playBeep = () => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.frequency.value = 880;
      gain.gain.value = 0.3;
      osc.start();
      osc.stop(audioCtx.currentTime + 0.1);
    };

    const playGo = () => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.frequency.value = 1200;
      gain.gain.value = 0.5;
      osc.start();
      osc.stop(audioCtx.currentTime + 0.3);
    };

    // カード描画
    const renderCards = () => {
      const names = loadPlayerNames();
      const grid = document.getElementById('playerGrid');
      grid.innerHTML = '';
      names.forEach((name, i) => {
        grid.innerHTML += `
          <div class="player-card" id="player-${i}">
            <input type="text" class="player-name-input" id="name-${i}" value="${name}" 
              placeholder="名前を入力" onchange="savePlayerNames()">
            <div class="time-label">行軍時間(秒)</div>
            <input type="number" class="time-input" id="time-${i}" value="15" min="1" max="300">
            <div class="countdown" id="countdown-${i}"></div>
            <div class="status" id="status-${i}">行軍時間を入力</div>
          </div>
        `;
      });
    };

    // カウントダウン開始
    const startCountdown = () => {
      if (isRunning) return;

      // AudioContext resume (mobile)
      if (audioCtx.state === 'suspended') audioCtx.resume();

      // 名前を保存
      savePlayerNames();

      // 名前入力をロック
      [0,1,2,3].forEach(i => {
        document.getElementById(`name-${i}`).classList.add('running');
      });

      const times = [0,1,2,3].map(i => parseInt(document.getElementById(`time-${i}`).value) || 15);
      const maxTime = Math.max(...times);
      const baseWait = 10;
      const waitTimes = times.map(t => baseWait + (maxTime - t));
      const totalTime = baseWait + maxTime;

      isRunning = true;
      document.getElementById('startBtn').disabled = true;
      document.getElementById('resetBtn').style.display = 'inline-block';

      // 集結選択を無効化
      document.getElementById('rally1').style.pointerEvents = 'none';
      document.getElementById('rally5').style.pointerEvents = 'none';

      // 入力を非表示、カウントダウンを表示
      [0,1,2,3].forEach(i => {
        document.getElementById(`time-${i}`).style.display = 'none';
        document.querySelector(`#player-${i} .time-label`).style.display = 'none';
        const countdownEl = document.getElementById(`countdown-${i}`);
        countdownEl.style.display = 'block';
        countdownEl.textContent = waitTimes[i];
        countdownEl.className = 'countdown';
        document.getElementById(`status-${i}`).textContent = '待機中...';
        document.getElementById(`player-${i}`).classList.add('waiting');
      });

      let elapsed = 0;
      const interval = setInterval(() => {
        elapsed++;

        [0,1,2,3].forEach(i => {
          const remaining = waitTimes[i] - elapsed;
          const countdownEl = document.getElementById(`countdown-${i}`);
          const statusEl = document.getElementById(`status-${i}`);
          const cardEl = document.getElementById(`player-${i}`);

          if (remaining > 0) {
            countdownEl.textContent = remaining;
            if (remaining <= 3) {
              playBeep();
              countdownEl.style.color = '#ef4444';
            }
          } else if (remaining === 0) {
            countdownEl.textContent = 'GO!';
            countdownEl.className = 'countdown go';
            statusEl.textContent = '今すぐ集結！';
            cardEl.classList.remove('waiting');
            cardEl.classList.add('go');
            playGo();
          }
        });

        const allDone = waitTimes.every(w => elapsed >= w);
        if (allDone && elapsed >= Math.max(...waitTimes) + 3) {
          clearInterval(interval);
        }
      }, 1000);

      timers.push(interval);
    };

    // リセット
    const reset = () => {
      isRunning = false;
      timers.forEach(t => clearInterval(t));
      timers = [];

      document.getElementById('startBtn').disabled = false;
      document.getElementById('resetBtn').style.display = 'none';
      document.getElementById('rally1').style.pointerEvents = 'auto';
      document.getElementById('rally5').style.pointerEvents = 'auto';

      [0,1,2,3].forEach(i => {
        document.getElementById(`time-${i}`).style.display = 'block';
        document.querySelector(`#player-${i} .time-label`).style.display = 'block';
        const countdownEl = document.getElementById(`countdown-${i}`);
        countdownEl.style.display = 'none';
        countdownEl.className = 'countdown';
        document.getElementById(`status-${i}`).textContent = '行軍時間を入力';
        document.getElementById(`player-${i}`).classList.remove('waiting', 'go');
        document.getElementById(`name-${i}`).classList.remove('running');
      });
    };

    // 初期化
    renderCards();
    document.getElementById('startBtn').onclick = startCountdown;
    document.getElementById('resetBtn').onclick = reset;
  </script>
</body>
</html>
